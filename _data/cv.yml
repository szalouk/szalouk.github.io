- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Cornell University, with Kilian Q. Weinberger and Christopher De Sa
      year: 2024 - Present
      description:
        - <b>Self-correcting diffusion language models.</b> Masked diffusion models cannot revise a token once it is generated, and learn from only a fraction of positions. Developing architectures and training objectives that supervise every token and let the model revise its own outputs (LOOT, first author)
        - <b>Hierarchical discrete diffusion.</b> Organized the vocabulary into a semantic tree rooted at the mask token, so generation refines meaning from coarse to specific and self-correction means moving to a different branch; derived a simplified objective for efficient training
        - <b>Planning in continuous latent space.</b> Diffusion over sentence embeddings as a planning step for autoregressive generation, with plans steered by lightweight classifiers (STAR-LDM)
        - <b>Separating knowledge from language ability.</b> Pre-training language models that store facts in an external database, making knowledge editable and verifiable; built the training pipeline and unlearning evaluations (LMLM)
        - "<b>Calibrated multivariate forecasts.</b> Showed that common definitions of multivariate calibration are performative: recalibrating a forecaster changes the test used to judge it (first author, ICML workshop)"

    - title: Graduate Research Assistant
      institution: Stanford Artificial Intelligence Laboratory
      year: 2020 - 2024
      description:
        - Uncertainty quantification and calibration with Stefano Ermon (NeurIPS 2023)
        - Machine learning for healthcare with Andrew Ng and Sharon Zhou

    - title: Research Assistant
